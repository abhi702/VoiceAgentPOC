[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-poc-orchestrator"
version = "0.1.0"
description = "Local synthetic-patient voice receptionist POC"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "openai>=1.60,<3",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "azure-cognitiveservices-speech>=1.40,<2",
  "azure-search-documents>=11.6,<12",
  "redis>=5.1,<7",
  "httpx>=0.27,<1",
  "pyyaml>=6.0.2,<7",
  "sentence-transformers>=3.1,<6",
  "rank-bm25>=0.2.2,<1",
  "mcp>=1.12,<2",
  "silero-vad>=6,<7",
  "torch>=2.5,<3",
  "tzdata>=2025.1",
]

[tool.setuptools.packages.find]
include = ["app*"]
namespaces = true

[tool.setuptools.package-data]
app = ["skills/*.md"]
